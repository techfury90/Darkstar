# darkstar.cfg:
#
# This file contains configuration parameters for Darkstar.
# All integers are specified in hexadecimal.
#

# System configuration
MemorySize = 0x400
HostID = 0x0000aa012345

# Disk options
# FloppyDriveImage =
# HardDriveImage = 

# Ethernet configuration
# HostPacketInterfaceName =

# TTY / maintenance console (the System Administrator's terminal on a
# headless server, e.g. Services).  Exposed as a TCP listener on the
# loopback address; connect with a telnet client.  0 disables.
# Note: this value is specified in decimal.
# TTYConsolePort = 9000

# Set false to emulate a headless server: the keyboard stops answering the
# IOP's boot-time identification probe, so software that supports both
# consoles (e.g. server diagnostics) uses the TTY console instead of the
# display.
# KeyboardAttached = true

# Display options
DisplayScale = 1
SlowPhosphor = true

# TOD (Time Of Day) Clock options
# TODSetMode specifies how to set the TOD clock at reset
# (see readme.txt).  Possible values are:
#  HostTimeY2K              
#  HostTime
#  SpecificDateAndTime
#  SpecificDate
#  NoChange
#
TODSetMode = NoChange
# TODDate = 1990/11/09
# TODDateTime = 1990/11/09 12:00:00

